name: Telegram Bot Listener - Every 5 Min

on:
  schedule:
    - cron: '*/5 * * * *'   # Every 5 minutes (GitHub minimum)
  workflow_dispatch:         # Manual trigger from GitHub UI

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write        # Needed to commit offset + tracker files

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Poll Telegram for commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_listener.py

      - name: Commit updated tracker and offset files
        run: |
          git config --local user.email "jobhunt-bot@github-actions"
          git config --local user.name "Job Hunt Bot"
          git add job-tracker-seen-jobs.md .bot_listener_offset || true
          git diff --staged --quiet || git commit -m "chore: bot listener update [skip ci]"
          git pull --rebase origin master
          git push
